<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F2FA"/>
      <stop offset="100%" style="stop-color:#FDFBF7"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8B0D0"/>
      <stop offset="100%" style="stop-color:#9B8EC0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4A455"/>
      <stop offset="100%" style="stop-color:#D4B865"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Subtle geometric circle -->
  <circle cx="256" cy="200" r="160" fill="none" stroke="#E8E4F2" stroke-width="2"/>

  <!-- Face silhouette — geometric abstract -->
  <ellipse cx="256" cy="200" rx="90" ry="105" fill="url(#face)" opacity="0.9"/>

  <!-- Eyes — simple geometric -->
  <circle cx="226" cy="185" r="14" fill="url(#gold)"/>
  <circle cx="286" cy="185" r="14" fill="url(#gold)"/>

  <!-- Eye highlights -->
  <circle cx="230" cy="181" r="5" fill="white" opacity="0.8"/>
  <circle cx="290" cy="181" r="5" fill="white" opacity="0.8"/>

  <!-- Subtle smile -->
  <path d="M 235 225 Q 256 245 277 225" fill="none" stroke="#C4A455" stroke-width="3" stroke-linecap="round"/>

  <!-- Crown/halo — AI CEO symbol -->
  <path d="M 196 115 L 210 95 L 230 110 L 256 85 L 282 110 L 302 95 L 316 115" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="95" r="4" fill="#C4A455"/>
  <circle cx="256" cy="85" r="5" fill="#C4A455"/>
  <circle cx="302" cy="95" r="4" fill="#C4A455"/>

  <!-- ARTI text -->
  <text x="256" y="370" text-anchor="middle" font-family="Century Gothic, Futura, sans-serif" font-size="48" font-weight="700" fill="#3D3648" letter-spacing="8">ARTI</text>

  <!-- Subtitle -->
  <text x="256" y="400" text-anchor="middle" font-family="Century Gothic, Futura, sans-serif" font-size="14" fill="#8B7EAA" letter-spacing="6">AI CEO</text>

  <!-- Sparkle accents -->
  <circle cx="155" cy="150" r="3" fill="#C4A455" opacity="0.6"/>
  <circle cx="360" cy="130" r="3" fill="#C4A455" opacity="0.6"/>
  <circle cx="140" cy="280" r="2" fill="#B8B0D0" opacity="0.5"/>
  <circle cx="375" cy="260" r="2" fill="#B8B0D0" opacity="0.5"/>
</svg>
